services:

  api:
    build:
      context: ./backend/backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - ./backend/.env
    environment:
      APP_NAME: ${APP_NAME:-AppMovil API}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_DIR: ${LOG_DIR:-/backend/logs}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      DATABASE_URL: ${DATABASE_URL}
      EVIDENCIAS_PATH: ${EVIDENCIAS_CONTAINER_PATH:-/mnt/evidencias}

      EVIDENCE_THUMBNAIL_CACHE_DIR: ${EVIDENCE_THUMBNAIL_CACHE_DIR:-/var/cache/appmovil/evidence-thumbnails}
      EVIDENCE_ORIGINAL_CACHE_DIR: ${EVIDENCE_ORIGINAL_CACHE_DIR:-/var/cache/appmovil/evidence-originals}
      EVIDENCE_THUMBNAIL_CACHE_MAX_BYTES: ${EVIDENCE_THUMBNAIL_CACHE_MAX_BYTES:-536870912}
      EVIDENCE_MEDIA_CACHE_MAX_BYTES: ${EVIDENCE_MEDIA_CACHE_MAX_BYTES:-2147483648}
      EVIDENCE_VIDEO_CACHE_MAX_FILE_BYTES: ${EVIDENCE_VIDEO_CACHE_MAX_FILE_BYTES:-16777216}

      EXPO_PUSH_TOKEN_ENCRYPTION_KEY: ${EXPO_PUSH_TOKEN_ENCRYPTION_KEY}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      EXPO_POLL_INTERVAL_SECONDS: ${EXPO_POLL_INTERVAL_SECONDS:-5}
      EXPO_POLL_BATCH_SIZE: ${EXPO_POLL_BATCH_SIZE:-100}

    volumes:
      - ./backend/logs:/backend/logs
      - ${EVIDENCIAS_HOST_PATH:-/mnt/evidencias_appmovil}:${EVIDENCIAS_CONTAINER_PATH:-/mnt/evidencias}
      - evidence-cache:/var/cache/appmovil

  push-worker:
    build:
      context: ./backend/backend
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    depends_on:
      - api

    env_file:
      - ./backend/.env

    environment:
      LOG_DIR: ${LOG_DIR:-/backend/logs}
      DATABASE_URL: ${DATABASE_URL}
      EXPO_PUSH_TOKEN_ENCRYPTION_KEY: ${EXPO_PUSH_TOKEN_ENCRYPTION_KEY}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      EXPO_POLL_INTERVAL_SECONDS: ${EXPO_POLL_INTERVAL_SECONDS:-5}
      EXPO_POLL_BATCH_SIZE: ${EXPO_POLL_BATCH_SIZE:-100}

    volumes:
      - ./backend/logs:/backend/logs
      - ${EVIDENCIAS_HOST_PATH:-/mnt/evidencias_appmovil}:${EVIDENCIAS_CONTAINER_PATH:-/mnt/evidencias}

  frontend:
    build:
      context: ./operadores-app
    container_name: appmovil-frontend
    restart: unless-stopped
    ports:
      - "3000:80"

volumes:
  evidence-cache:
